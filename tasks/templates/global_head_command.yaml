id: <command_id>
type: global_head_command
created_by: <global-head-agent-id>
created_at: "YYYY-MM-DDTHH:MM:SS+TZ"
priority: normal
target_servers:
  - <server>
target_session_boundary:
  codex_session_id: <session-id>
  repository_cwd: /absolute/path/to/ODE-edit
  repository_identity: hyunjun1127/ODE-edit
  preflight_command: "scripts/check-session-boundary.sh <session-id>"
ack_required: true
command_summary: "<short command>"
instructions:
  - "<step 1>"
  - "<step 2>"
acceptance_criteria:
  - "<observable result>"
expected_updates:
  - "messages/acks/<server>/YYYY-MM-DD.md"
  - "tasks/status/<command_id>/<server>.json"
  - "messages/server-heads/<server>/YYYY-MM-DD.md"
closure_policy:
  owner: global-head
  close_when: "all target servers are done or explicitly waived"
  closure_note: "tasks/done/<command_id>.closure.md"
notes: "Copy this file into tasks/pending/ and replace fields before dispatch. Server-heads must not claim or move this task."
