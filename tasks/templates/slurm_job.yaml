id: exp_example
type: slurm_job
created_by: <global-head-agent-id>
created_at: "YYYY-MM-DDTHH:MM:SS+TZ"
cwd: /path/to/project
command: bash scripts/run_exp.sh
resources:
  gpu: 1
  mem_gb: 48
  time: "24:00:00"
allowed_workers: []
outputs:
  artifact_dir: /path/to/project/results/exp_example
  stdout: /path/to/project/logs/exp_example.out
  stderr: /path/to/project/logs/exp_example.err
notes: "Copy this file into tasks/pending/ and replace fields before dispatch."
